[project]
name = "zont-mcp"
version = "0.1.0"
description = "MCP server for the ZONT API (zont-online.ru) — control and monitor ZONT / Mega SX devices from any MCP client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
zont-mcp = "zont_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zont_mcp"]
